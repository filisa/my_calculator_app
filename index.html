<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>JavaScript Calculator</title>
		<link rel="stylesheet" href="styles.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<main class="calculator" aria-label="Calculator">
			<div class="screen">
				<div id="history" class="history" aria-hidden="true"></div>
				<output id="display" class="display" aria-label="Result">0</output>
			</div>
			<div id="keys" class="keys">
				<button class="utility smaller_font gray_btn" data-action="clear">
					ac
				</button>
				<button class="utility gray_btn" data-action="sign">&#xb1;</button>
				<button class="utility gray_btn" data-action="percent">%</button>
				<button class="operator orange_btn" data-operator="/">&#xf7;</button>

				<button data-digit="7">7</button>
				<button data-digit="8">8</button>
				<button data-digit="9">9</button>
				<button class="operator orange_btn" data-operator="*">&#xd7;</button>

				<button data-digit="4">4</button>
				<button data-digit="5">5</button>
				<button data-digit="6">6</button>
				<button class="operator orange_btn" data-operator="-">-</button>

				<button data-digit="1">1</button>
				<button data-digit="2">2</button>
				<button data-digit="3">3</button>
				<button class="operator orange_btn" data-operator="+">+</button>

				<button data-digit="0">0</button>
				<button data-action="decimal">,</button>
				<!-- &larr; is the back arrow -->
				<button dat-class="utility" data-action="backspace">&larr;</button>
				<button id="equal" class="operator orange_btn" data-action="equal">
					=
				</button>
			</div>
		</main>
	</body>
</html>
